[project]
name = "simclr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "tqdm",
    "ipykernel",
    "ms-entropy>=1.5.2",
]

[dependency-groups]
dev = [
    "cupy-cuda12x>=14.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

