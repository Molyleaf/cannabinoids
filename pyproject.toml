[project]
name = "simclr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "tqdm",
    "ipykernel",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

